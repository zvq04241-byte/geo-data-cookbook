# e-Stat 都道府県人口増加率 2024年度 4階級分類 — リファレンス値
# stats-id: 0000010101 (社会・人口統計体系)
# cat01:    A192003 (人口増加率 ‰)
# time:     2024100000
#
# 構造的事実 (2024年度):
#   - 東京都が人口増加率1位 (唯一プラス、+6.6‰)
#   - 三大都市圏の中核は第1階級に集中 (埼玉・神奈川・大阪・千葉・愛知)
#   - 沖縄も第1階級 (出生率高め)
#   - 鳥取・島根・長崎・愛媛・山口など中国・四国地方が第4階級

fetch_args: "--stats-id 0000010101 --cat01 A192003 --time 2024100000 --classify-n 4"

expected:
  area_column: "area"
  value_column: "value"
  row_count: 47
  top1_area: "東京都"
  must_include_in_top5:
    - "東京都"
    # 1位以外の順序はわずかに揺れ得るが、Top5 内には必ず以下が入る
    - "埼玉県"
    - "神奈川県"
  must_include_in_topN:
    n: 20
    areas:
      - "東京都"
      - "埼玉県"
      - "神奈川県"
      - "大阪府"
      - "千葉県"
      - "沖縄県"
      - "福岡県"
      - "愛知県"
  must_not_include_anywhere:
    # e-Stat は area_code で都道府県だけに絞られているはずだが、念のため
    - "全国"
    - "Japan"
    - "三大都市圏"
    - "東京圏"
  value_descending: true
  unit: "‰"
  # ★値域チェック（2026-07-21 追加）。実測は 東京+6.6‰ 〜 秋田-18.7‰。
  #   人口増加率(‰)なので±50を超えたら単位取り違え（％と‰の混同等）。
  value_within_range:
    value: {min: -50, max: 50}
